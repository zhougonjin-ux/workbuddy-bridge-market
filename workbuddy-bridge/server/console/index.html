<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f8cff'/%3E%3Ctext x='16' y='21' font-size='13' font-weight='700' font-family='sans-serif' fill='white' text-anchor='middle'%3EWB%3C/text%3E%3C/svg%3E">
<title>WorkBuddy 积分桥 · 控制台</title>
<script>
/* T45 主题引导：首帧渲染前定好 data-theme，避免亮色用户看到暗色闪一下。
 * localStorage wbTheme 优先；没设置过则跟随系统 prefers-color-scheme。 */
(function () {
  var t = null;
  try { t = localStorage.getItem('wbTheme'); } catch (e) { /* 隐私模式等 */ }
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="stylesheet" href="/console/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">WB</span>WorkBuddy 积分桥 <span class="ver" id="ver"></span></div>
  <div id="srvMeta"></div>
  <div id="alerts"></div>
</header>
<main>
  <!-- 0.3.24：无页签架构 —— 大屏是控制台本体，子页面只从大屏面板下钻进入，返回条/浏览器历史负责回退 -->
  <div id="backBar" hidden>
    <button class="btn mini" id="btnHome">← 返回大屏</button>
    <b id="viewTitle"></b>
    <span class="muted" id="viewHint" style="font-size:12px"></span>
  </div>
  <section id="view-home"></section>
  <section id="view-accounts" hidden></section>
  <section id="view-models" hidden></section>
  <section id="view-tasks" hidden></section>
  <section id="view-usage" hidden></section>
  <section id="view-events" hidden></section>
  <section id="view-settings" hidden>
    <div id="sec-guide"></div>
    <div id="sec-health" style="margin-top:22px"></div>
    <div style="margin-top:22px">
      <div class="row" style="margin-bottom:10px">
        <button class="btn mini" id="logPause">暂停滚动</button>
        <button class="btn mini" id="logClear">清屏</button>
        <span class="muted" style="font-size:12px">实时日志（长轮询，仅本机内存最近 500 条）</span>
      </div>
      <div id="logBox"></div>
    </div>
  </section>
</main>
<div id="modalRoot"></div>
<div id="toast"></div>
<script src="/console/qrcode.min.js"></script>
<script src="/console/app.js"></script>
</body>
</html>
